name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Install package dependencies (for validation)
        run: pip install -e ".[dev]"

      - name: Run tests before publishing
        run: python -m pytest tests/ -v --tb=short

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — uses OIDC Trusted Publishing.
        # Configure Trusted Publishing in your PyPI project settings:
        #   Publisher: GitHub Actions
        #   Owner: awesome-lang-auth
        #   Repository: awesome-python-auth
        #   Workflow: publish.yml

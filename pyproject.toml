[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-python-auth"
version = "1.1.0"
description = "FastAPI authentication library compatible with ng-awesome-node-auth and awesome-node-auth-flutter"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nik2208" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "PyJWT>=2.12.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.22",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Repository = "https://github.com/awesome-lang-auth/awesome-python-auth"
Issues = "https://github.com/awesome-lang-auth/awesome-python-auth/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["awesome_python_auth"]
